name: PR05 checks

on:
  push:
    branches: [pr05]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop-full@sha256:d16957210572c5f919f3f9bd2fb0cc24a82542647489d8b8eda7c3beda31305f
    steps:
      - name: Prepare Node for checkout
        shell: bash
        run: |
          test "$(uname -m)" = x86_64
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl xz-utils python3-pytest ros-jazzy-ament-copyright ros-jazzy-ament-flake8 ros-jazzy-ament-pep257 ros-jazzy-rosbag2-storage-mcap
          curl -fsSLo /tmp/node.tar.xz https://nodejs.org/dist/v22.19.0/node-v22.19.0-linux-x64.tar.xz
          printf '%s  %s\n' c0649af18e6a24f6fe5535a3e86b341dd49a8e71117c8b68bde973ef834f16f2 /tmp/node.tar.xz | sha256sum -c -
          tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
          node --version

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build PR05 package
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install
          source install/setup.bash
          test -f "$(ros2 pkg prefix turtle_bringup)/share/turtle_bringup/launch/sim.launch.py"
          python3 -m py_compile src/turtle_bringup/launch/sim.launch.py
          test -f "$(ros2 pkg prefix course_bringup)/share/course_bringup/launch/patrol.launch.py"
          ros2 launch course_bringup patrol.launch.py --show-args
          colcon test --event-handlers console_direct+
          colcon test-result --verbose

      - name: Read pinned course kit from PR05 report
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          from urllib.parse import urlparse

          kit = json.loads(Path('evidence/pr05/report.json').read_text())['course_kit']
          url = kit['archive_url']
          parsed = urlparse(url)
          assert parsed.scheme == 'https' and parsed.netloc == 'ros.lms.ci.nsu.ru'
          assert '\n' not in url and '\r' not in url
          assert re.fullmatch('[0-9a-f]{64}', kit['archive_sha256'])
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('COURSE_KIT_URL=' + url + '\n')
              output.write('COURSE_KIT_SHA256=' + kit['archive_sha256'] + '\n')
          PY

      - name: Download pinned course kit
        shell: bash
        run: |
          curl --retry 2 --connect-timeout 10 --max-time 120 -fsSLo /tmp/course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" /tmp/course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf /tmp/course-kit.tar.gz -C .course-kit

      - name: Check PR05 evidence
        shell: bash
        run: python3 .course-kit/v1/tools/check_practice.py PR05 --submission .
