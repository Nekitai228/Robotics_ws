name: PR03 checks

on:
  push:
    branches: [pr03]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop-full@sha256:d16957210572c5f919f3f9bd2fb0cc24a82542647489d8b8eda7c3beda31305f
    steps:
      - name: Prepare Node for checkout
        shell: bash
        run: |
          test "$(uname -m)" = x86_64
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl xz-utils python3-pytest ros-jazzy-ament-copyright ros-jazzy-ament-flake8 ros-jazzy-ament-pep257
          curl -fsSLo /tmp/node.tar.xz https://nodejs.org/dist/v22.19.0/node-v22.19.0-linux-x64.tar.xz
          printf '%s  %s\n' c0649af18e6a24f6fe5535a3e86b341dd49a8e71117c8b68bde973ef834f16f2 /tmp/node.tar.xz | sha256sum -c -
          tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
          node --version

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build PR03 package
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --packages-select turtle_bringup patrol
          source install/setup.bash
          test -f "$(ros2 pkg prefix turtle_bringup)/share/turtle_bringup/launch/sim.launch.py"
          python3 -m py_compile src/turtle_bringup/launch/sim.launch.py
          (cd src/patrol && python3 -m pytest test)

      - name: Download pinned course kit
        shell: bash
        env:
          COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w03-7fbfd3e8161a.tar.gz
          COURSE_KIT_SHA256: 7fbfd3e8161ab6c6ebefc7663efdaf77d9a7d490399743507f33dcefbd5ac522
        run: |
          curl -fsSLo course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf course-kit.tar.gz -C .course-kit

      - name: Check PR03 evidence
        shell: bash
        run: python3 .course-kit/v1/tools/check_practice.py PR03 --submission .
